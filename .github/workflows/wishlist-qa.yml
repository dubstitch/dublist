name: Wade List responsive and accessibility QA
on:
  push:
    branches: [main, "repair/ios-layout"]
    paths:
      - "assets/**"
      - "data/**"
      - "*.html"
      - "qa/**"
      - ".github/workflows/wishlist-qa.yml"
  workflow_dispatch:
concurrency:
  group: wishlist-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and axe
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.11.0
          npx playwright install chromium webkit --with-deps
      - name: Serve site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/wishlist-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/index.html >/dev/null
      - name: Verify section rail navigation on home and catalogs
        run: node qa/section-rail-qa.mjs
      - name: Audit responsive behavior and accessibility
        run: |
          BROWSER_NAME=chromium SHOW_SHOTS=1 node qa/wishlist-qa.mjs
          BROWSER_NAME=webkit SHOW_SHOTS=1 node qa/wishlist-qa.mjs
