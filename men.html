<!doctype html>
<html lang="en" class="no-js snap-page">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Men — Wade List</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/nav.css" />
  <link rel="stylesheet" href="assets/css/category.css" />
  <link rel="stylesheet" href="assets/css/modal.css" />
  <link rel="stylesheet" href="assets/css/footer.css" />
</head>
<body data-page="men">
  <div class="announce-bar" data-announce-bar>
    <div class="container" style="position: relative;">
      <p class="announce-bar__text">Private wishlist for Des, Mom &amp; Dad</p>
      <button type="button" class="announce-bar__close icon-btn" data-announce-close aria-label="Dismiss announcement">
        <img src="assets/images/icons/close.svg" alt="" />
      </button>
    </div>
  </div>

  <header class="site-header">
    <div class="site-header__inner container">
      <a href="index.html" class="wordmark">WADE LIST</a>
      <nav class="main-nav" aria-label="Primary">
        <a href="index.html" class="main-nav__link">Home</a>
        <button type="button" class="main-nav__trigger" data-menu-trigger aria-expanded="false" aria-controls="megaMenu">
          Women <img class="chevron" src="assets/images/icons/chevron-down.svg" alt="" />
        </button>
        <button type="button" class="main-nav__trigger" data-menu-trigger data-current="true" aria-expanded="false" aria-controls="megaMenu">
          Men <img class="chevron" src="assets/images/icons/chevron-down.svg" alt="" />
        </button>
      </nav>
      <div class="site-header__icons">
        <button type="button" class="icon-btn" aria-label="Search"><img src="assets/images/icons/search.svg" alt="" /></button>
        <button type="button" class="icon-btn" aria-label="Wishlist"><img src="assets/images/icons/heart.svg" alt="" /></button>
        <button type="button" class="icon-btn icon-btn--account" aria-label="Account"><img src="assets/images/icons/account.svg" alt="" /></button>
        <button type="button" class="icon-btn icon-btn--menu" data-mobile-menu-trigger aria-label="Open menu"><img src="assets/images/icons/menu.svg" alt="" /></button>
      </div>
    </div>

    <div class="mega-menu" id="megaMenu" data-mega-menu>
      <div class="mega-menu__inner container">
        <div class="mega-menu__half" data-cols="4">
          <div class="mega-menu__col">
            <p class="mega-menu__mobile-heading">Women</p>
            <p class="mega-menu__col-title" data-nav-title="women-shop"></p>
            <ul data-nav-list="women-shop"></ul>
          </div>
          <div class="mega-menu__col">
            <p class="mega-menu__col-title" data-nav-title="women-designers"></p>
            <ul data-nav-list="women-designers"></ul>
          </div>
          <div class="mega-menu__col">
            <p class="mega-menu__col-title" data-nav-title="women-collections"></p>
            <ul data-nav-list="women-collections"></ul>
          </div>
          <div class="mega-menu__feature" data-nav-feature="women"></div>
        </div>
        <div class="mega-menu__divider"></div>
        <div class="mega-menu__half" data-cols="3">
          <div class="mega-menu__col">
            <p class="mega-menu__mobile-heading">Men</p>
            <p class="mega-menu__col-title" data-nav-title="men-shop"></p>
            <ul data-nav-list="men-shop"></ul>
          </div>
          <div class="mega-menu__col">
            <p class="mega-menu__col-title" data-nav-title="men-designers"></p>
            <ul data-nav-list="men-designers"></ul>
          </div>
          <div class="mega-menu__feature" data-nav-feature="men"></div>
        </div>
      </div>
    </div>
  </header>
  <div class="mega-menu-backdrop" data-mega-menu-backdrop></div>

  <main>
    <div class="category-scroll" data-category-scroll>
      <div class="category-track" data-category-track>
        <div class="category-stage" data-category-stage></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__links">
      <div class="container site-footer__links-inner">
        <a href="#">About</a>
        <a href="#">FAQ</a>
        <a href="#">Contact</a>
        <a href="#">Shipping &amp; Returns</a>
        <a href="#">Privacy</a>
      </div>
    </div>
    <div class="container site-footer__base-inner">
      <div class="site-footer__brand">
        <span class="site-footer__wordmark">WADE LIST</span>
        <span class="site-footer__divider">|</span>
        <span class="site-footer__tagline">Private Wishlist</span>
      </div>
      <p class="site-footer__copyright">© 2026 Wade List. All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="assets/js/main.js"></script>

</html>
